theme:
  name: material      # selección del tema
  custom_dir: overrides   # icones pròpies a overrides/.icons
  language: es        # idioma del tema per defecte (ABC)
  logo: img/logo.png
  favicon: img/favicon.png
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    alternate: idioma/language   # icona del selector d'idioma (overrides/.icons/idioma/language.svg)

  palette:
   # Boto que canvia a mode oscur
    - scheme: default
      primary: '#1d4975'      # colores: amber, orange, lime. Otros: teal, red, pink, purple, deep purple, cyan, green, light green, blue grey
      accent: '#1d4975'
      toggle:
        icon: material/weather-night
        name: Cambia a modo oscuro
    # Botó que canvia a mode clar
    - scheme: slate
      primary: '#1d4975'
      accent: '#1d4975'
      toggle:
        icon: material/white-balance-sunny
        name: Cambia a modo normal
  features:
    # utilitats de copia de codi
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - navigation.footer       # footer de la pagina, amb navegació
    - navigation.top          # boto flotant de tornar a dalt

# Traduccions dels titols del menu per a la UI (ABC)
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arturoblasco
      text: "Github de Arturo BC"

# Extensions
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - attr_list         # permet afegir atributs a les etiquetes html
  # Bloques de código modernos con colores y nombre de lenguaje
  - pymdownx.highlight:
      linenums: false
      anchor_linenums: false
      auto_title: false      # ❌ evita título arriba del bloque
      use_pygments: true     # ✅ activa resaltado de sintaxis
      pygments_style: default
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Extensiones útiles adicionales
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

# Altres afegits
plugins:
  - search      # plugin del quadre cerca

  # Multiidioma (pip install mkdocs-static-i18n)
  # Castellà: pagina.md  ->  /pagina/
  # Valencià: pagina.ca.md  ->  /ca/pagina/  (si no existix, es mostra la versió en castellà)
  # El selector d'idioma apareix al costat del botó de mode fosc.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Castellano
          default: true
          build: true
        - locale: ca
          name: Valencià
          build: true
          site_name: "Desenvolupament Web en Entorn Servidor (DWES)"
          theme:
            palette:
              - scheme: default
                primary: '#1d4975'
                accent: '#1d4975'
                toggle:
                  icon: material/weather-night
                  name: Canvia a mode fosc
              - scheme: slate
                primary: '#1d4975'
                accent: '#1d4975'
                toggle:
                  icon: material/white-balance-sunny
                  name: Canvia a mode clar
          nav_translations:
            "Inicio": "Inici"
            "Curso 26-27": "Curs 26-27"
            "Contenidos": "Continguts"
            "Qué debo saber hacer": "Què he de saber fer"
            "U02 Lenguaje PHP": "U02 Llenguatge PHP"
            "U04 Programación web": "U04 Programació web"
            "U05 Acceso a Base de Datos": "U05 Accés a bases de dades"
            "U06 ED profesional": "U06 ED professional"
            "U07 Fundamentos": "U07 Fonaments"
            "U08 Gestión de datos": "U08 Gestió de dades"
            "U09 Interacción con usuario": "U09 Interacció amb l'usuari"
            "U10 Servicios web (API REST)": "U10 Serveis web (API REST)"
            "U11 Aplicación híbrida con Vue": "U11 Aplicació híbrida amb Vue"
            "U12 Despliegue": "U12 Desplegament"
            "Actividades": "Activitats"
            "🟢 Proyecto": "🟢 Projecte"
            "U13 Proyecto": "U13 Projecte"

  # Tot el material en una sola pàgina per a imprimir o guardar en PDF
  # (pip install mkdocs-print-site-plugin). Ha d'anar l'últim.
  # El botó de PDF de la capçalera (javascripts/pdf.js) obri esta pàgina.
  - print-site:
      add_to_navigation: false
      print_page_title: "DWES"
      add_print_site_banner: false
      add_cover_page: true
      add_table_of_contents: true
      toc_depth: 2
      enumerate_headings: false
      add_full_urls: false
      exclude:
        - index.md
        - index.ca.md
        - ra-ce.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/calendario.css
  - stylesheets/ra_ce.css
  - stylesheets/pdf.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/calendario.js
  - javascripts/ra_ce.js
  - javascripts/pdf.js

# Mapa de RA i CE exportat des del Gestor de RA i CE (ra_ce.json)
hooks:
  - hooks/ra_ce.py
  - hooks/i18n_assets.py   # rutes d'imatges en HTML dins de les pàgines /ca/

